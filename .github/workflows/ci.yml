name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install ruff mypy
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy

  python-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run compatibility smoke suite
        run: >
          pytest -o addopts='-ra --strict-config --strict-markers'
          -m 'not slow'
          tests/test_packaging_metadata.py
          tests/differentiability
          tests/jit
          tests/physics
          tests/test_compatibility.py
          tests/test_motion_shape_compat.py

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: parity
            pytest_paths: tests/parity
          - shard: upstream
            pytest_paths: tests/upstream_mirror
          - shard: getft
            pytest_paths: tests/test_getft.py
          - shard: rest
            pytest_paths: >-
              tests
              --ignore=tests/parity
              --ignore=tests/upstream_mirror
              --ignore=tests/test_getft.py
    env:
      COVERAGE_FILE: covdata.${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run test shard with coverage
        run: >
          pytest -o addopts='-ra --strict-config --strict-markers'
          -m 'not slow'
          --cov=src/magpylib_jax --cov-report= --cov-fail-under=0
          ${{ matrix.pytest_paths }}
      - name: Upload coverage shard
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.shard }}
          path: covdata.${{ matrix.shard }}
          if-no-files-found: error

  coverage-combine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install coverage tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage[toml]
      - name: Download coverage shards
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - name: Combine and enforce coverage
        run: |
          python -m coverage combine --data-file=covdata coverage
          python -m coverage report --data-file=covdata --fail-under=95
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[docs]'
      - name: Build docs
        run: sphinx-build -W -b html docs docs/_build/html

  benchmark-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run benchmark
        run: |
          python scripts/benchmark_vs_magpylib.py \
            --n-observers 600 \
            --repeats 1 \
            --output benchmarks/latest.json
      - name: Validate thresholds
        run: python scripts/check_benchmark_thresholds.py benchmarks/latest.json benchmarks/thresholds.json
