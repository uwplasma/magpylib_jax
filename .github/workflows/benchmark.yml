name: Benchmark

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run benchmark
        run: |
          python scripts/benchmark_vs_magpylib.py \
            --n-observers 4000 \
            --repeats 3 \
            --output benchmarks/latest.json
      - name: Validate thresholds
        run: python scripts/check_benchmark_thresholds.py benchmarks/latest.json benchmarks/thresholds.json
